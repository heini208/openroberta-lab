    def servo_get_angle(angle):
        if (angle < 0): 
            angle = 0
        if (angle > 180): 
            angle = 180
        return round(0.55 * angle) + 25

RECEIVE_MESSAGE:
  PYTHON: |
    def receive_message(type):
        global rssi
        details = radio.receive_full()
        if details:
            msg, rssi, timestamp = details
            msg = msg.decode('utf-8')[3:]
            if type == "Number":
                try:
                    digit = float(msg)
                except ValueError:
                    digit = 0
                return digit
            elif type == "Boolean":
                return msg == 'True' or msg == '1'     
            elif type == "String":
                return msg
        else:
            if type == "Number":
                return 0
            elif type == "Boolean":
                return False       
            elif type == "String":
                return ''


GET_ROTATION:
  PYTHON: |
    def get_Rotation(dim):
        x = -calliopemini.accelerometer.get_y()
        y = calliopemini.accelerometer.get_x()
        z = -calliopemini.accelerometer.get_z()
        roll = math.atan2(y, z)
        if (dim == "roll"):
            return math.floor((-360*roll)/(2*math.pi))
        elif (dim == "pitch"):
            factor = y * math.sin(roll) + z * math.cos(roll)
            if factor != 0:
                pitch = math.atan(-x / (factor))            
                return math.floor((360*pitch)/(2*math.pi))

SETUP_WIFI:
  PYTHON: |
    def setup_wifi():
        global _WIFI_CONNECTED, _SETUP_COMPLETE
        if _SETUP_COMPLETE:
            return
        calliopemini.uart.init(baudrate=115200, tx=calliopemini.pin_A1_TX, rx=calliopemini.pin_A1_RX)
        calliopemini.sleep(500)
    
        def send_at(cmd):
            calliopemini.uart.write(cmd + "\r\n")
    
        def wait_response(t1, t2, timeout):
            buf = ""
            start = calliopemini.running_time()
            while (calliopemini.running_time() - start) < timeout:
                if calliopemini.uart.any():
                    try:
                        buf += calliopemini.uart.read().decode('utf-8', 'ignore')
                    except:
                        pass
                if t1 in buf:
                    return 1
                if t2 in buf:
                    return 2
                calliopemini.sleep(100)
            return 0
    
        calliopemini.sleep(200)
        while calliopemini.uart.any():
            calliopemini.uart.read()
    
        calliopemini.display.show(".")
        send_at("AT")
        if wait_response("OK", "ERROR", 1000) == 0:
            calliopemini.display.show("X")
            calliopemini.sleep(2000)
            _SETUP_COMPLETE = True
            return
    
        send_at("AT+CWMODE=1")
        wait_response("OK", "ERROR", 1000)
    
        calliopemini.display.show("..")
        send_at("AT+CWJAP=\"" + _SSID + "\",\"" + _WIFI_PASSWORD + "\"")
        result = wait_response("WIFI GOT IP", "ERROR", 20000)
    
        if result == 1:
            _WIFI_CONNECTED = True
            calliopemini.display.show(calliopemini.Image.YES)
        else:
            calliopemini.display.show(calliopemini.Image.NO)
    
        calliopemini.sleep(1000)
        calliopemini.display.clear()
        _SETUP_COMPLETE = True

SEND_AND_WAIT:
  PYTHON: |
    def send_and_wait(cmd, timeout=2000):
        """Send AT command and wait for response"""
        calliopemini.uart.write(cmd + "\r\n")
        buf = ""
        start = calliopemini.running_time()
        while (calliopemini.running_time() - start) < timeout:
            if calliopemini.uart.any():
                try:
                    buf += calliopemini.uart.read().decode('utf-8', 'ignore')
                except:
                    pass
            calliopemini.sleep(50)
        return buf

PARSE_LIST_RESPONSE:
  PYTHON: |
    def parse_list_from_response(response, prefix="Response:"):
        marker = response.find(prefix + '[')
        if marker > -1:
            start = marker + len(prefix) + 1
            end = response.find(']', start)
            if end > -1:
                list_str = response[start:end]
                result = []
                for num in list_str.split(','):
                    if num.strip():
                        result.append(int(num.strip()))
                return result
        return None

HTTP_GET:
  PYTHON: |
    def http_get(path):
        """Perform HTTP GET request and return raw response"""
        if not _WIFI_CONNECTED:
            return "NC"
        send_and_wait("AT+CIPCLOSE", 500)
        connect_resp = send_and_wait("AT+CIPSTART=\"TCP\",\"" + _WIFI_IP + "\"," + _WIFI_PORT, 5000)
        if "ERROR" in connect_resp:
            return "ERR"
        # Build and send HTTP request
        req = "GET " + path + " HTTP/1.1\r\nHost: " + _WIFI_IP + "\r\n\r\n"
        send_and_wait("AT+CIPSEND=" + str(len(req)), 2000)
        calliopemini.sleep(300)
        resp = send_and_wait(req, 5000)
        send_and_wait("AT+CIPCLOSE", 500)
    
        return resp

    def http_get_clean(path):
        """Perform HTTP GET and return cleaned response data"""
        raw_response = http_get(path)
        return extract_ipd_data(raw_response)
    
    def extract_ipd_data(response):
        """Extract actual data from ESP8285 +IPD response"""
        ipd_marker = response.find('+IPD,')
        if ipd_marker > -1:
            colon_pos = response.find(':', ipd_marker)
            if colon_pos > -1:
                return response[colon_pos + 1:]
        return response

SIMULATE_QBIT_MEASURE:
  PYTHON: |
    def simulate_qbit_measure(num_qbits):
        calliopemini.display.show("...")
        # Get response from server
        response = http_get_clean("/measure?qbits=" + str(num_qbits))
        pattern_list = parse_list_from_response(response, "Response:")
        if pattern_list:
            calliopemini.display.show(calliopemini.Image.YES)
            calliopemini.sleep(500)
            calliopemini.display.clear()
            return pattern_list
        return []
