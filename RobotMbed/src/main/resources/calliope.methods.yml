    def servo_get_angle(angle):
        if (angle < 0): 
            angle = 0
        if (angle > 180): 
            angle = 180
        return round(0.55 * angle) + 25

RECEIVE_MESSAGE:
  PYTHON: |
    def receive_message(type):
        global rssi
        details = radio.receive_full()
        if details:
            msg, rssi, timestamp = details
            msg = msg.decode('utf-8')[3:]
            if type == "Number":
                try:
                    digit = float(msg)
                except ValueError:
                    digit = 0
                return digit
            elif type == "Boolean":
                return msg == 'True' or msg == '1'     
            elif type == "String":
                return msg
        else:
            if type == "Number":
                return 0
            elif type == "Boolean":
                return False       
            elif type == "String":
                return ''


GET_ROTATION:
  PYTHON: |
    def get_Rotation(dim):
        x = -calliopemini.accelerometer.get_y()
        y = calliopemini.accelerometer.get_x()
        z = -calliopemini.accelerometer.get_z()
        roll = math.atan2(y, z)
        if (dim == "roll"):
            return math.floor((-360*roll)/(2*math.pi))
        elif (dim == "pitch"):
            factor = y * math.sin(roll) + z * math.cos(roll)
            if factor != 0:
                pitch = math.atan(-x / (factor))            
                return math.floor((360*pitch)/(2*math.pi))

SETUP_WIFI:
  PYTHON: |
    def wifi_connect(ssid, password):
        init_uart()
        steps = [("AT", 250), ("ATE0", 250), ("AT+RST", 1600), ("AT+CWMODE_CUR=1", 250),
    ('AT+CWJAP_CUR="{0}","{1}"'.format(ssid, password), 6500), ("AT+CIFSR", 400)]
        for i, (cmd, delay) in enumerate(steps):
            calliopemini.display.show(len(steps) - i - 1)
            ok, _ = at_cmd(cmd, timeout_ms=delay, expect_ok=True)
            if not ok:
              calliopemini.display.show(calliopemini.Image.NO)
              return False
        
        calliopemini.display.show(calliopemini.Image.YES)
        calliopemini.sleep(500)
        calliopemini.display.clear()
        return True
    
    def init_uart():
        _UART.init(baudrate=_UART_BAUD, tx=calliopemini.pin_A1_TX, rx=calliopemini.pin_A1_RX)

    def at_cmd(cmd, expect_ok=True, timeout_ms=1200):
        _UART.write((cmd + "\r\n").encode("utf-8"))
        resp = read_until_idle_adaptive(timeout_ms=timeout_ms)
        if expect_ok and "OK" not in resp:
            return False, resp
        return True, resp

    def at_cmd_resp(cmd, timeout_ms=1200):
        _UART.write((cmd + "\r\n").encode("utf-8"))
        return read_until_idle_adaptive(timeout_ms=timeout_ms)
    
    def read_until_idle_adaptive(timeout_ms=3000, min_idle_ms=50, factor=4):
        start = calliopemini.running_time()
        last_rx = None
        normal_gap = None
        buf = ""
    
        while calliopemini.running_time() - start < timeout_ms:
            if _UART.any():
                chunk = _UART.read()
                now = calliopemini.running_time()
    
                if isinstance(chunk, bytes):
                    buf += safe_decode(chunk)
                else:
                    buf += str(chunk)
    
                if last_rx is not None:
                    gap = now - last_rx
                    if normal_gap is None:
                        normal_gap = gap
                    else:
                        normal_gap = (normal_gap * 3 + gap) // 4
                last_rx = now
            else:
                if buf and last_rx is not None and normal_gap is not None:
                    idle = calliopemini.running_time() - last_rx
                    adaptive_idle = max(min_idle_ms, normal_gap * factor)
                    if idle > adaptive_idle:
                        break
                calliopemini.sleep(20)
    
        return buf

    def safe_decode(chunk):
        try:
            return chunk.decode("utf-8")
        except Exception:
            return "".join(chr(b) for b in chunk)

SEND_AND_WAIT:
  PYTHON: |
    def send_tcp_command(host, port, payload, timeout_ms=2000):
        resp = at_cmd_resp('AT+CIPSTART="TCP","{0}",{1}'.format(host, port), timeout_ms=1500)
        if "ERROR" in resp or resp == "":
            return False, resp
        payload_line = payload if payload.endswith("\n") else payload + "\n"
        send_len = len(payload_line)
        resp = at_cmd_resp("AT+CIPSEND={0}".format(send_len), timeout_ms=600)
    
        if ">" not in resp:
            more = read_until_idle_adaptive(timeout_ms=600)
            resp += more
        if ">" not in resp:
            at_cmd("AT+CIPCLOSE", timeout_ms=300, expect_ok=False)
            return False, resp
    
        _UART.write(payload_line.encode("utf-8"))
        server_resp = read_until_keyword(timeout_ms = timeout_ms)
    
        at_cmd("AT+CIPCLOSE", timeout_ms=300, expect_ok=False)
        return True, server_resp
    
    def flush_uart():
        while _UART.any():
            _UART.read()
    
    def read_until_keyword(keyword = "TCPRESPONSE:", timeout_ms=30000):
        start = calliopemini.running_time()
        full = ""
        while True:
            if calliopemini.running_time() - start >= timeout_ms:
                return full
            flush_uart()
            buf = read_until_idle_adaptive(timeout_ms=1000)
            if not buf:
              calliopemini.sleep(30)
              continue
            full += buf
            if keyword in full:
              return full


PARSE_LIST_RESPONSE:
  PYTHON: |
    def extract_list_from_response(response):
        start = response.find("[")
        end = response.find("]", start)
        if start != -1 and end != -1:
            inner = response[start + 1:end].strip()
            if inner == "":
                return []
            return [int(x) for x in inner.split(",")]

GET_CLEAN_RESPONSE:
  PYTHON: |
    def get_clean_response(response):
        if "TCPRESPONSE: " in response:
            return response.split("TCPRESPONSE: ", 1)[1].strip()
        return ""

