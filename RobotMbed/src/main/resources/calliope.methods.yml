    def servo_get_angle(angle):
        if (angle < 0): 
            angle = 0
        if (angle > 180): 
            angle = 180
        return round(0.55 * angle) + 25

RECEIVE_MESSAGE:
  PYTHON: |
    def receive_message(type):
        global rssi
        details = radio.receive_full()
        if details:
            msg, rssi, timestamp = details
            msg = msg.decode('utf-8')[3:]
            if type == "Number":
                try:
                    digit = float(msg)
                except ValueError:
                    digit = 0
                return digit
            elif type == "Boolean":
                return msg == 'True' or msg == '1'     
            elif type == "String":
                return msg
        else:
            if type == "Number":
                return 0
            elif type == "Boolean":
                return False       
            elif type == "String":
                return ''


GET_ROTATION:
  PYTHON: |
    def get_Rotation(dim):
        x = -calliopemini.accelerometer.get_y()
        y = calliopemini.accelerometer.get_x()
        z = -calliopemini.accelerometer.get_z()
        roll = math.atan2(y, z)
        if (dim == "roll"):
            return math.floor((-360*roll)/(2*math.pi))
        elif (dim == "pitch"):
            factor = y * math.sin(roll) + z * math.cos(roll)
            if factor != 0:
                pitch = math.atan(-x / (factor))            
                return math.floor((360*pitch)/(2*math.pi))

SETUP_WIFI:
  PYTHON: |
    def wifi_connect(ssid, password):
        init_uart()
    
        at_cmd("AT", timeout_ms=300, expect_ok=False)
        at_cmd("ATE0", timeout_ms=250, expect_ok=False)
        flush_uart()
    
        ok, resp = at_cmd("AT+CWJAP_CUR?", timeout_ms=2000, expect_ok=True)
        flush_uart()
    
        if ok and ssid in resp:
            calliopemini.display.show(calliopemini.Image.YES)
            calliopemini.sleep(500)
            calliopemini.display.clear()
            return True
    
        steps = [
            ("AT+CWMODE_CUR=1", 500, True),
            ('AT+CWJAP_CUR="{0}","{1}"'.format(ssid, password), 20000, True),
            ("AT+CIFSR", 800, False),
        ]
    
        for i, (cmd, timeout, expect_ok) in enumerate(steps):
            calliopemini.display.show(len(steps) - i - 1)
            ok, _ = at_cmd(cmd, timeout_ms=timeout, expect_ok=expect_ok)
            flush_uart()
    
            if not ok and expect_ok:
                calliopemini.display.show(calliopemini.Image.NO)
                calliopemini.sleep(500)
                calliopemini.display.clear()
                return False
    
        calliopemini.display.show(calliopemini.Image.YES)
        calliopemini.sleep(500)
        calliopemini.display.clear()
        return True
    
    def init_uart():
        _UART.init(baudrate=_UART_BAUD, tx=calliopemini.pin_A1_TX, rx=calliopemini.pin_A1_RX)
    
    def at_cmd(cmd, timeout_ms=1200, expect_ok=True):
        _UART.write((cmd + "\r\n").encode("utf-8"))
        resp = uart_read_all(timeout_ms)
        ok = (("OK" in resp) if expect_ok else True) and ("ERROR" not in resp)
        return ok, resp
    
    def uart_read_all(timeout_ms):
        start = calliopemini.running_time()
        buf = ""
        while calliopemini.running_time() - start < timeout_ms:
            if _UART.any():
                buf += safe_decode(_UART.read())
            else:
                calliopemini.sleep(10)
        return buf
    
    def safe_decode(chunk):
        try:
            return chunk.decode("utf-8")
        except Exception:
            return "".join(chr(b) for b in chunk)
    
    def flush_uart(ms=250):
        start = calliopemini.running_time()
        while calliopemini.running_time() - start < ms:
            if _UART.any():
                _UART.read()
            calliopemini.sleep(10)
    
    def send_cmd_raw(cmd, timeout_ms=3000):
        resp = send_tcp_command(_WIFI_IP, _WIFI_PORT, cmd, timeout_ms=timeout_ms)
        if resp is None:
            return None
        return resp.strip()

SEND_AND_WAIT:
  PYTHON: |
    def send_tcp_command(host, port, payload, timeout_ms=6000):
        flush_uart(200)
        ok, resp = at_cmd('AT+CIPSTART="TCP","{0}",{1}'.format(host, int(port)),
                          timeout_ms=2500, expect_ok=False)
        if "ERROR" in resp or resp.strip() == "":
            return None
    
        payload_line = payload if payload.endswith("\n") else payload + "\n"
        send_len = len(payload_line.encode("utf-8"))
    
        ok, resp = at_cmd("AT+CIPSEND={0}".format(send_len), timeout_ms=1500, expect_ok=False)
        if ">" not in resp:
            at_cmd("AT+CIPCLOSE", timeout_ms=400, expect_ok=False)
            return None
    
        _UART.write(payload_line.encode("utf-8"))
        raw = uart_read_all(timeout_ms)
    
        at_cmd("AT+CIPCLOSE", timeout_ms=400, expect_ok=False)
        flush_uart(200)
        out = ""
        i = 0
        while True:
            p = raw.find("+IPD,", i)
            if p == -1:
                break
            colon = raw.find(":", p)
            if colon == -1:
                break
    
            header = raw[p:colon]           # "+IPD,12" or "+IPD,0,12"
            parts = header.split(",")
            try:
                if len(parts) == 2:
                    n = int(parts[1])
                elif len(parts) == 3:
                    n = int(parts[2])
                else:
                    i = colon + 1
                    continue
            except:
                i = colon + 1
                continue
    
            data_start = colon + 1
            data = raw[data_start:data_start + n]
            out += data
    
            i = data_start + n
        if out.startswith("LEN:"):
            nl = out.find("\n")
            if nl != -1:
                try:
                    m = int(out[4:nl].strip())
                    payload = out[nl + 1:]
                    if len(payload) < m:
                        return None
                    return payload[:m]
                except:
                    pass
        return out if out else raw

