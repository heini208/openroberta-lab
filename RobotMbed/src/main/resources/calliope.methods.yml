SETUP_IBM:
  PYTHON: |
    def init_ibm(token):
        cmd = "CONFIGURE_IBM {}".format(token)
        ok, resp = send_tcp_command(_WIFI_IP, _WIFI_PORT, cmd, timeout_ms=3000)
        if ok and "OK" in resp:
            calliopemini.display.show(calliopemini.Image.YES)
            calliopemini.sleep(500)
            calliopemini.display.clear()
            return True
        else:
            calliopemini.display.show(calliopemini.Image.NO)
            calliopemini.sleep(1000)
            calliopemini.display.clear()
            return False

START_REAL_QBIT_JOB:
  PYTHON: |
    def start_ibm_real_job(n_qubits=3):
        cmd = "START_REAL_JOB {}".format(n_qubits)
        ok, resp = send_tcp_command(_WIFI_IP, _WIFI_PORT, cmd, timeout_ms=30000)
        if not ok:
            return None
        resp = get_clean_response(resp)
        if resp.startswith("JOBID:"):
            job_id = resp[len("JOBID:"):].strip()
            return job_id
        else:
            return None

