CMD_STRING:
  PYTHON: |
    def send_cmd_expect_string(cmd, timeout_ms=3000, strip_prefix=None):
        resp = send_cmd_raw(cmd, timeout_ms)

        if not resp or resp.startswith("ERROR"):
            return None

        if strip_prefix and resp.startswith(strip_prefix):
            resp = resp[len(strip_prefix):].strip()

        return resp

