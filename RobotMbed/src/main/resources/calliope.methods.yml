CMD_LIST:
  PYTHON: |
    def send_cmd_expect_list(cmd, timeout_ms=3000):
        resp = send_cmd_raw(cmd, timeout_ms)
        return extract_list_from_response(resp)
    
    
    def extract_list_from_response(response):
        if not response:
            return []
    
        start = response.find("[")
        end = response.find("]", start)
        if start == -1 or end == -1:
            return []
        inner = response[start + 1:end].strip()
        if not inner:
            return []
        parts = [p.strip() for p in inner.split(",") if p.strip() != ""]
        if '"' in inner:
            return [x.strip().strip('"') for x in parts]
        try:
            return [int(x) for x in parts]
        except:
            try:
                return [float(x) for x in parts]
            except:
                return []
